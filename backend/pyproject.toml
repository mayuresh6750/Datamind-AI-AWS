[project]
name = "datamind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "supabase>=2.4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # LLM
    "google-generativeai>=0.7.0",
    "litellm>=1.40.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # Agent orchestration
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    # Data parsing
    "openpyxl>=3.1.0",
    "python-magic>=0.4.27",
    "chardet>=5.2.0",
    "pyarrow>=16.0.0",
    # SQL safety
    "sqlglot>=23.0.0",
    # Observability
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
